<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Пульт заказов цеха</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Верх (шапка + показатели + графики) — тёмный графит; низ (таблицы, люди) — светлый. Акценты: лайм = норма, пыльная роза = проблема, песочный = внимание */
:root{
  --d-bg:#2b353e; --d-panel:#38444e; --d-line:#46535e; --d-fg:#f2f5f3; --d-muted:#a7b3bc;
  --l-bg:#eef1ee; --l-panel:#ffffff; --l-line:#dde3df; --l-fg:#25303a; --l-muted:#6b7780;
  --lime:#9bcb45; --lime-l:#5f9a1f; --rose:#d38f8f; --rose-l:#b4504f; --sand:#d9c27a; --sand-l:#9a7a12;
  --track-d:#4a5762; --track-l:#e6ebe7;
  --f:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--l-bg);color:var(--l-fg);font-family:var(--f);font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.in{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dark{background:var(--d-bg);color:var(--d-fg)}
header .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:14px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.meta{font-size:12px;color:var(--d-muted);display:flex;gap:12px;flex-wrap:wrap}
.meta .upd.bad{color:var(--rose)}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav a{color:var(--d-muted);text-decoration:none;padding:5px 12px;border-radius:5px;font-weight:500}
nav a:hover{color:var(--d-fg)}
nav a.on{background:var(--lime);color:#1f2a14}
.tb{font:inherit;font-size:13px;background:transparent;color:var(--d-muted);border:1px solid var(--d-line);border-radius:5px;padding:5px 10px;cursor:pointer}
.tb:hover{color:var(--d-fg);border-color:var(--d-muted)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
#band .in{padding-block:6px 26px;display:flex;flex-direction:column;gap:14px}
h2{margin:0 0 10px;font-size:17px;font-weight:600}
.dark h2{color:var(--d-fg)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.k{background:var(--d-panel);border-radius:6px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.k .v{font-size:40px;font-weight:600;line-height:1.05;white-space:nowrap}
.k .v small{font-size:20px;color:var(--d-muted);font-weight:500}
.k .l{font-size:13px;color:var(--d-fg)}
.k .s{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--d-muted);min-height:18px}
.tag{display:inline-block;padding:1px 6px;border-radius:2px;font-size:11px;font-weight:600;color:#1f2a14;background:var(--lime)}
.tag.bad{background:var(--rose);color:#3a1515} .tag.warn{background:var(--sand);color:#3a2e07}
.k.bad .v{color:var(--rose)} .k.warn .v{color:var(--sand)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.ch{background:var(--d-panel);border-radius:6px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:6px}
.ch h3{margin:0;font-size:14px;font-weight:600}
.ch .sub{font-size:11px;color:var(--d-muted)}
.ch svg{width:100%;height:auto;display:block}
.ch svg text{font-family:var(--f)}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut svg{width:150px;flex:none}
.leg{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--d-muted)}
.leg b{display:block;font-size:20px;color:var(--d-fg);font-weight:600}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
main.in{padding-block:24px 40px;display:flex;flex-direction:column;gap:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:22px}
.grid2>section{min-width:0}
.card{background:var(--l-panel);border:1px solid var(--l-line);border-radius:6px}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;color:var(--l-muted);text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--l-line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--l-line)}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.dn{font-size:22px;font-weight:600;width:56px;text-align:right}
.c-bad{color:var(--rose-l)} .c-warn{color:var(--sand-l)} .c-ok{color:var(--lime-l)} .c-mut{color:var(--l-muted)}
.flag{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:3px;background:var(--rose-l);color:#fff;font-weight:700;font-size:11px;margin-left:3px}
.flag.p1{background:var(--l-fg)}
.bars{padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(0,160px) 1fr 34px 64px;gap:10px;align-items:center;font-size:13px}
.hb .hl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .ht{position:relative;height:12px;background:var(--track-l);border-radius:2px;overflow:hidden}
.hb .ht i{position:absolute;inset:0 auto 0 0;background:var(--lime-l)}
.hb .ht b{position:absolute;inset:0 auto 0 0;background:var(--rose-l)}
.hb .hv{font-weight:600;text-align:right}
.hb .hs{color:var(--l-muted);font-size:12px;text-align:right}
.debt .hb{grid-template-columns:minmax(0,170px) 1fr 70px}
.debt .ht i{background:var(--sand-l)}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pc{background:var(--l-panel);border:1px solid var(--l-line);border-radius:6px;padding:9px 11px;display:grid;grid-template-columns:1fr auto;gap:0 6px;min-width:0;border-bottom:3px solid var(--l-line)}
.pn{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw{font-size:11px;color:var(--l-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{font-size:24px;font-weight:600;grid-row:span 2;align-self:center}
.pc.free{border-bottom-color:var(--lime-l)} .pc.free .pv{color:var(--lime-l)}
.pc.busy{border-bottom-color:var(--l-fg)}
.pc.warn{border-bottom-color:var(--sand-l)} .pc.warn .pv{color:var(--sand-l)}
.pc.bad{border-bottom-color:var(--rose-l)} .pc.bad .pv{color:var(--rose-l)}
.empty{padding:18px;text-align:center;color:var(--l-muted)}
.zero{padding:16px;text-align:center;font-size:30px;font-weight:600;color:var(--lime-l)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
input,select{font:inherit;color:var(--l-fg);background:var(--l-panel);border:1px solid var(--l-line);border-radius:5px;padding:7px 9px;min-width:0}
.chip{display:inline-block;padding:1px 7px;border-radius:3px;font-size:12px;background:var(--track-l);white-space:nowrap}
.chip.bad{background:#f6e3e2;color:var(--rose-l)} .chip.warn{background:#f5eed6;color:var(--sand-l)} .chip.ok{background:#e7f1db;color:var(--lime-l)} .chip.acc{background:var(--l-fg);color:#fff}
tr.closed td{color:var(--l-muted)}
td.num{white-space:nowrap}
.muted{color:var(--l-muted)}
@media (max-width:560px){.k .v{font-size:32px}.hb{grid-template-columns:minmax(0,100px) 1fr 28px 56px}h1{font-size:19px}}
</style></head><body>
<header class="dark"><div class="in">
  <div><h1>Пульт заказов цеха</h1><div class="meta"><span id="today"></span><span id="status" class="upd">загрузка…</span></div></div>
  <nav>
    <a href="#dash" data-tab="dash">Сводка</a>
    <a href="#orders" data-tab="orders">Заказы</a>
    <a href="#staff" data-tab="staff">Персонал</a>
    <button class="tb" id="btnReload" type="button">Обновить</button>
    <button class="tb" id="btnPick" type="button">Файл…</button>
    <input type="file" id="fileIn" accept=".xlsx,.xls" hidden>
  </nav>
</div></header>
<div class="dark" id="band"><div class="in">
  <div class="kp" id="kp"></div>
  <div class="charts">
    <div class="ch"><h3>Сроки сдачи</h3><div class="sub">заказов в работе по неделям</div><div id="chWeeks"></div></div>
    <div class="ch"><h3>Оплата заказов в работе</h3><div class="sub">₽</div><div id="chPay" class="donut"></div></div>
    <div class="ch"><h3>Принято заказов</h3><div class="sub">сумма по месяцам приёма, ₽</div><div id="chMonths"></div></div>
  </div>
</div></div>
<main class="in view" id="view-dash">
  <div class="grid2">
    <section><h2>Горит <span id="hotN" class="c-bad"></span></h2><div class="card tablebox" id="hot"></div></section>
    <section><h2>Этапы</h2><div class="card bars" id="stages"></div></section>
  </div>
  <div class="grid2">
    <section><h2>Люди <span id="pplN" class="c-mut"></span></h2><div class="ppl" id="ppl"></div></section>
    <section><h2>Должники</h2><div class="card bars debt" id="debt"></div></section>
  </div>
</main>
<main class="in view" id="view-orders" hidden>
  <div class="filters">
    <input id="q" type="search" placeholder="Поиск: заказчик, изделие, №, сотрудник" style="flex:1 1 240px">
    <select id="fStatus"><option value="active">В работе</option><option value="all">Все заказы</option><option value="closed">Закрытые</option></select>
    <select id="fWorker"><option value="">Все сотрудники</option></select>
  </div>
  <div class="card tablebox" id="ordersTable"></div>
</main>
<main class="in view" id="view-staff" hidden><div class="card tablebox" id="staffTable"></div></main>
<script src="xlsx.full.min.js"></script>
<script>
const DATA_URL="data/zakazy.xlsx";
const STAGES=["Заявка/расчёт","КП отправлено","Договор/предоплата","Конструкторская документация","Закупка металла","Резка","Гибка","Мехобработка","Сварка","Сборка","Покраска","Электрика/наладка","ОТК/испытания","Упаковка","Отгрузка","Монтаж у заказчика","Закрыт"];
const CLOSED=new Set(["Отгружен","Закрыт","Отменён"]);
const XHEAD={num:"№ заказа",date:"Дата приёма",client:"Заказчик",contact:"Контакт (тел/имя)",item:"Изделие / что делаем",type:"Тип",sum:"Сумма, ₽",paid:"Оплачено, ₽",deadline:"Срок сдачи",stage:"Этап",worker:"Кто делает сейчас",resp:"Ответственный",status:"Статус",priority:"Приоритет",risk:"Проблема / риск",next:"Следующий шаг",updated:"Обновлено"};
let orders=[],staff=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub=n=>(Number(n)||0).toLocaleString("ru-RU",{maximumFractionDigits:0})+" ₽";
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO=()=>iso(new Date());
const fmtD=s=>{if(!s)return"";const[y,m,d]=s.split("-");return d+"."+m+"."+y.slice(2)};
function daysLeft(o){if(!o.deadline||CLOSED.has(o.status))return null;return Math.round((new Date(o.deadline+"T00:00:00")-new Date(todayISO()+"T00:00:00"))/864e5)}
const isActive=o=>!CLOSED.has(o.status);
function payState(o){const s=+o.sum||0,p=+o.paid||0;if(!s)return["—",""];if(p>=s)return["Оплачен","ok"];if(p>0)return["Предоплата "+Math.round(p/s*100)+"%","warn"];return["Не оплачен","bad"]}
function dayChip(o){const d=daysLeft(o);if(d===null)return o.deadline?`<span class="chip">${fmtD(o.deadline)}</span>`:"";if(d<0)return`<span class="chip bad">просрочен ${-d} дн.</span>`;if(d===0)return`<span class="chip bad">сегодня</span>`;if(d<=3)return`<span class="chip warn">${d} дн.</span>`;return`<span class="chip">${d} дн.</span>`}
function sev(o){const d=daysLeft(o);if(d!==null&&d<0)return"bad";if((d!==null&&d<=3)||o.risk)return"warn";return"ok"}
$("today").textContent=new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
function route(){const t=(location.hash||"#dash").slice(1);const tab=["dash","orders","staff"].includes(t)?t:"dash";
  document.querySelectorAll(".view").forEach(v=>{const on=v.id==="view-"+tab;v.hidden=!on;if(on)v.style.display="flex"});
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.tab===tab));$("band").hidden=tab!=="dash"}
addEventListener("hashchange",route);route();

const short=n=>String(n).replace(/\s*\(.*\)\s*/,"");
const kr=n=>{n=+n||0;const a=Math.abs(n);return a>=1e6?(n/1e6).toLocaleString("ru-RU",{maximumFractionDigits:2})+" млн":a>=1e3?Math.round(n/1e3).toLocaleString("ru-RU")+" тыс":String(n)};
const C={lime:"#9bcb45",rose:"#d38f8f",sand:"#d9c27a",track:"#4a5762",fg:"#f2f5f3",mut:"#a7b3bc"};
function cols(data,h){const W=320,H=h||150,top=22,bot=26,n=data.length,gw=W/n,bw=Math.min(34,gw*.55),mx=Math.max(1,...data.map(d=>d.v));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  s+=`<line x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}" stroke="${C.track}"/>`;
  data.forEach((d,i)=>{const x=i*gw+(gw-bw)/2,bh=(H-top-bot)*d.v/mx,y=H-bot-bh;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,d.v?2:0)}" rx="2" fill="${d.c||C.lime}"><title>${esc(d.l)}: ${esc(d.t??d.v)}</title></rect>`;
    s+=`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="600" fill="${d.v?C.fg:C.mut}">${esc(d.t??d.v)}</text>`;
    s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="${C.mut}">${esc(d.l)}</text>`});
  return s+"</svg>"}
function donut(parts,center,sub){const R=60,r=44,cx=75,cy=75,tot=parts.reduce((a,p)=>a+p.v,0);let a0=-Math.PI/2,s=`<svg viewBox="0 0 150 150" role="img">`;
  if(!tot)s+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${C.track}" stroke-width="${R-r}"/>`;
  else parts.forEach(p=>{if(!p.v)return;const a1=a0+2*Math.PI*p.v/tot*(p.v===tot?.9999:1),L=a1-a0>Math.PI?1:0,
    P=(rr,a)=>`${cx+rr*Math.cos(a)} ${cy+rr*Math.sin(a)}`;
    s+=`<path d="M${P(R,a0)} A${R} ${R} 0 ${L} 1 ${P(R,a1)} L${P(r,a1)} A${r} ${r} 0 ${L} 0 ${P(r,a0)}Z" fill="${p.c}"><title>${esc(p.l)}</title></path>`;a0=a1});
  return s+`<text x="75" y="76" text-anchor="middle" font-size="24" font-weight="600" fill="${C.fg}">${esc(center)}</text><text x="75" y="94" text-anchor="middle" font-size="10.5" fill="${C.mut}">${esc(sub)}</text></svg>`}
function renderAll(){renderDash();renderOrders();renderStaff()}
function renderDash(){
  const act=orders.filter(isActive), dl=o=>daysLeft(o), debt=o=>Math.max(0,(+o.sum||0)-(+o.paid||0)), S=l=>l.reduce((a,o)=>a+(+o.sum||0),0);
  const overL=act.filter(o=>dl(o)!==null&&dl(o)<0), soonL=act.filter(o=>dl(o)!==null&&dl(o)>=0&&dl(o)<=3);
  const riskL=act.filter(o=>o.risk), nopayL=act.filter(o=>(+o.sum||0)>0&&!(+o.paid));
  const sum=S(act), dbt=act.reduce((a,o)=>a+debt(o),0), pct=sum?Math.round((sum-dbt)/sum*100):0;
  const busy=staff.filter(n=>act.some(o=>o.worker===n)).length;
  const K=(v,l,s,c)=>`<div class="k ${c||""}"><div class="v">${v}</div><div class="l">${l}</div><div class="s">${s||""}</div></div>`;
  const T=(t,c)=>`<span class="tag ${c||""}">${t}</span>`;
  $("kp").innerHTML=
    K(act.length,"Заказов в работе",T(kr(sum)+" ₽"))+
    K(overL.length,"Просрочено",overL.length?T(kr(S(overL))+" ₽","bad"):T("нет"),overL.length?"bad":"")+
    K(soonL.length,"Сдать за 3 дня",soonL.length?T(kr(S(soonL))+" ₽","warn"):T("нет"),soonL.length?"warn":"")+
    K(riskL.length,"С проблемой",riskL.length?T("см. «Горит»","bad"):T("нет"),riskL.length?"bad":"")+
    K(kr(dbt).replace(/ (млн|тыс)$/,"<small> $1</small>"),"Долг заказчиков, ₽",T(pct+"% оплачено",pct<50?"warn":""),dbt?"warn":"")+
    K(nopayL.length,"Без предоплаты",nopayL.length?T(kr(S(nopayL))+" ₽","warn"):T("нет"),nopayL.length?"warn":"")+
    K(`${busy}<small>/${staff.length}</small>`,"Людей занято",T("свободно "+(staff.length-busy)));
  const wk=[{l:"просроч.",v:0,c:C.rose},{l:"эта нед.",v:0,c:C.sand},{l:"2-я",v:0},{l:"3-я",v:0},{l:"4-я",v:0},{l:"позже",v:0,c:"#7f8f99"}];
  act.forEach(o=>{const d=dl(o);if(d===null)return;wk[d<0?0:d<7?1:d<14?2:d<21?3:d<28?4:5].v++});
  $("chWeeks").innerHTML=cols(wk);
  $("chPay").innerHTML=donut([{v:sum-dbt,c:C.lime,l:"получено"},{v:dbt,c:C.rose,l:"долг"}],pct+"%","оплачено")+
    `<div class="leg"><div><i style="background:${C.lime}"></i>получено<b>${kr(sum-dbt)}</b></div><div><i style="background:${C.rose}"></i>долг<b>${kr(dbt)}</b></div></div>`;
  const now=new Date(),ms=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push({k:d.getFullYear()+"-"+pad(d.getMonth()+1),l:d.toLocaleDateString("ru-RU",{month:"short"}).replace(".",""),v:0})}
  orders.forEach(o=>{const m=ms.find(x=>o.date&&o.date.startsWith(x.k));if(m)m.v+=(+o.sum||0)});
  $("chMonths").innerHTML=cols(ms.map((m,i)=>({l:m.l,v:m.v,t:m.v?kr(m.v):"0",c:i===ms.length-1?C.lime:"#6f8f4a"})));
  const hot=act.filter(o=>(dl(o)!==null&&dl(o)<=3)||o.risk||(o.priority||"").startsWith("1")).sort((a,b)=>(dl(a)??999)-(dl(b)??999));
  $("hotN").textContent=hot.length||"";
  $("hot").innerHTML=hot.length?`<table><thead><tr><th class="r">дн.</th><th>№</th><th>этап</th><th>кто</th><th class="r">долг ₽</th><th></th></tr></thead><tbody>${
    hot.map(o=>{const d=dl(o),c=d===null?"":d<0?"c-bad":d<=3?"c-warn":"";
      return`<tr title="${esc(o.client+" · "+o.item)}"><td class="dn ${c}">${d===null?"–":d}</td><td class="num"><b>${esc(o.num)}</b></td><td>${esc(o.stage)}</td><td>${esc(short(o.worker))||'<span class="c-bad">—</span>'}</td><td class="r num">${debt(o)?kr(debt(o)):"0"}</td><td class="r">${o.risk?`<span class="flag" title="${esc(o.risk)}">!</span>`:""}${(o.priority||"").startsWith("1")?'<span class="flag p1" title="Срочно">1</span>':""}</td></tr>`}).join("")}</tbody></table>`
    :`<div class="zero">0</div>`;
  const by={};act.forEach(o=>{const s=o.stage||"Без этапа";(by[s]=by[s]||[]).push(o)});
  const st=[...STAGES,...Object.keys(by).filter(s=>!STAGES.includes(s))].filter(s=>by[s]), smx=Math.max(1,...st.map(s=>by[s].length));
  $("stages").innerHTML=st.length?st.map(s=>{const l=by[s],b=l.filter(o=>dl(o)!==null&&dl(o)<0).length;
    return`<div class="hb"><span class="hl">${esc(s)}</span><span class="ht"><i style="width:${l.length/smx*100}%"></i>${b?`<b style="width:${b/smx*100}%"></b>`:""}</span><span class="hv">${l.length}</span><span class="hs">${kr(S(l))}</span></div>`}).join("")
    :`<div class="zero">0</div>`;
  $("pplN").textContent=staff.length?`${busy}/${staff.length}`:"";
  $("ppl").innerHTML=staff.length?staff.map(n=>{const m=act.filter(o=>o.worker===n),od=m.some(o=>dl(o)!==null&&dl(o)<0),c=m.length===0?"free":od?"bad":m.length>1?"warn":"busy";
    return`<div class="pc ${c}" title="${esc(n)}"><span class="pn">${esc(short(n))}</span><span class="pv">${m.length}</span><span class="pw">${m.map(o=>esc(o.num)).join(" ")||"свободен"}</span></div>`}).join("")
    :`<div class="card empty">нет списка сотрудников</div>`;
  const dd={};act.forEach(o=>{if(debt(o))dd[o.client]=(dd[o.client]||0)+debt(o)});
  const top=Object.entries(dd).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=top[0]?top[0][1]:1;
  $("debt").innerHTML=top.length?top.map(([c,v])=>`<div class="hb"><span class="hl" title="${esc(c)}">${esc(c)}</span><span class="ht"><i style="width:${Math.max(3,v/mx*100)}%"></i></span><span class="hv">${kr(v)}</span></div>`).join(""):`<div class="zero">0</div>`;
}
function renderOrders(){
  const q=$("q").value.trim().toLowerCase(), fs=$("fStatus").value, w=$("fWorker"), fw=w.value;
  w.innerHTML=`<option value="">Все сотрудники</option>`+staff.map(n=>`<option${n===fw?" selected":""}>${esc(n)}</option>`).join("");
  let list=orders.filter(o=>fs==="all"||(fs==="active"?isActive(o):!isActive(o)));
  if(fw)list=list.filter(o=>o.worker===fw||o.resp===fw);
  if(q)list=list.filter(o=>[o.num,o.client,o.item,o.worker,o.resp].join(" ").toLowerCase().includes(q));
  list.sort((a,b)=>((daysLeft(a)??9999)-(daysLeft(b)??9999))||String(a.num).localeCompare(String(b.num),"ru",{numeric:true}));
  $("ordersTable").innerHTML=list.length?`<table><thead><tr><th>№</th><th>Заказчик</th><th>Изделие</th><th>Срок</th><th>Этап</th><th>Кто делает</th><th>Статус</th><th class="r">Сумма</th><th>Оплата</th><th>Приоритет</th><th>Риск</th></tr></thead><tbody>${
    list.map(o=>{const p=payState(o);return`<tr class="${isActive(o)?"":"closed"}"><td class="num">${esc(o.num)}</td><td>${esc(o.client)}</td><td>${esc(o.item)}</td><td>${dayChip(o)}</td><td>${esc(o.stage)}</td><td>${esc(o.worker)}</td><td>${esc(o.status)}</td><td class="num r">${rub(o.sum)}</td><td><span class="chip ${p[1]}">${p[0]}</span></td><td>${(o.priority||"").startsWith("1")?`<span class="chip bad">${esc(o.priority)}</span>`:esc(o.priority)}</td><td>${o.risk?`<span class="chip bad">${esc(o.risk)}</span>`:""}</td></tr>`}).join("")}</tbody></table>`
    :`<div class="empty">Под фильтр ничего не попало.</div>`;
}
function renderStaff(){const act=orders.filter(isActive);
  $("staffTable").innerHTML=staff.length?`<table><thead><tr><th>Сотрудник</th><th class="r">Заказов в работе</th><th>Сейчас делает</th></tr></thead><tbody>${
    staff.map(n=>{const m=act.filter(o=>o.worker===n);return`<tr><td>${esc(n)}</td><td class="num r">${m.length}</td><td>${m.map(o=>esc(o.num+" ("+(o.stage||"")+")")).join(", ")||'<span class="muted">свободен</span>'}</td></tr>`}).join("")}</tbody></table>`
    :`<div class="empty">Список сотрудников не найден в файле.</div>`}
["q","fStatus","fWorker"].forEach(i=>$(i).addEventListener("input",renderOrders));

const norm=s=>String(s??"").toLowerCase().replace(/[^a-zа-яё№]/g,"");
function cellDate(v){if(v instanceof Date&&!isNaN(v))return iso(v);if(typeof v==="number"){const p=XLSX.SSF.parse_date_code(v);if(p)return p.y+"-"+pad(p.m)+"-"+pad(p.d)}
  if(typeof v==="string"){const m=v.match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);if(m)return(m[3].length===2?"20"+m[3]:m[3])+"-"+pad(m[2])+"-"+pad(m[1]);if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10)}return""}
function parse(buf){
  const wb=XLSX.read(buf,{cellDates:true});
  const sh=wb.Sheets["Заказы"]||wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:""});
  const hi=rows.findIndex(r=>r.some(c=>norm(c)==="№заказа"));if(hi<0)throw new Error("на листе «Заказы» нет строки с заголовком «№ заказа»");
  const map={};rows[hi].forEach((h,i)=>{const n=norm(h);for(const[k,t]of Object.entries(XHEAD))if(norm(t)===n||(k==="contact"&&n.startsWith("контакт")))map[k]=i});
  const list=[];for(const r of rows.slice(hi+1)){const num=String(r[map.num]??"").trim();if(!num)continue;const o={num};
    for(const k in map){let v=r[map[k]];if(["date","deadline","updated"].includes(k))v=cellDate(v);else if(k==="sum"||k==="paid")v=Number(v)||0;else v=String(v??"").trim();o[k]=v}
    o.num=num;if(!o.status)o.status="В работе";list.push(o)}
  let people=[];const sp=wb.Sheets["Справочники"];
  if(sp){const sr=XLSX.utils.sheet_to_json(sp,{header:1,defval:""});const h=sr.findIndex(r=>r.some(c=>norm(c)==="сотрудники"));
    if(h>=0){const ci=sr[h].findIndex(c=>norm(c)==="сотрудники");people=sr.slice(h+1).map(r=>String(r[ci]??"").trim()).filter(Boolean)}}
  list.forEach(o=>{if(o.worker)people.push(o.worker)});
  orders=list;staff=[...new Set(people)];renderAll();
}
function setStatus(t,c){const s=$("status");s.textContent=t||"";s.className="upd "+(c||"")}
async function load(){
  if(location.protocol==="file:"){setStatus("Страница открыта как файл с компьютера. Нажмите «Открыть файл…» и выберите Excel с заказами.","warn");return}
  try{const r=await fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("файл с данными не найден ("+r.status+")");
    parse(await r.arrayBuffer());const lm=r.headers.get("last-modified");
    setStatus("обновлено "+(lm?new Date(lm):new Date()).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}),"quiet")}
  catch(e){setStatus("Не удалось загрузить данные: "+e.message,"bad")}}
$("btnReload").addEventListener("click",load);
$("btnPick").addEventListener("click",()=>$("fileIn").click());
$("fileIn").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{parse(await f.arrayBuffer());setStatus("файл: "+f.name,"quiet")}catch(err){setStatus("Файл не прочитан: "+err.message,"bad")}});
load();setInterval(()=>{if(location.protocol!=="file:"&&!document.hidden)load()},5*60*1000);
</script>
